<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasbeeh Counter - عداد التسبيح</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a5a2a">
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;font-family:system-ui;background:#0a5a2a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}
h1{font-size:28px;margin:10px}
#count{font-size:90px;margin:20px;font-weight:bold}
button{font-size:22px;padding:15px 35px;margin:8px;border:none;border-radius:30px;cursor:pointer}
#inc{background:#fff;color:#0a5a2a}
#reset{background:#ffcc00;color:#000}
</style>
</head>
<body>
<h1>عداد التسبيح</h1>
<div id="count">0</div>
<button id="inc" onclick="inc()">سبح</button>
<button id="reset" onclick="reset()">إعادة</button>
<script>
let c=parseInt(localStorage.getItem('tasbeeh')||'0');
document.getElementById('count').textContent=c;
function inc(){c++;document.getElementById('count').textContent=c;localStorage.setItem('tasbeeh',c)}
function reset(){c=0;document.getElementById('count').textContent=0;localStorage.setItem('tasbeeh',0)}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>

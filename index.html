<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد التسبيح - Tasbeeh Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI', Tahoma, sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.header{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card{width:100%;max-width:420px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border-radius:28px;padding:24px;border:1px solid rgba(255,255,255,0.1)}
.azkar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.azkar button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#cbd5e1;padding:14px;border-radius:16px;font-size:15px;cursor:pointer}
.azkar button.active{background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#fff;box-shadow:0 8px 20px rgba(14,165,233,0.4)}
.counter-circle{width:220px;height:220px;border-radius:50%;background:conic-gradient(from 0deg,#0ea5e9,#22d3ee,#0ea5e9);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;position:relative;box-shadow:0 0 40px rgba(14,165,233,0.3)}
.counter-circle::before{content:'';position:absolute;inset:8px;background:#0f172a;border-radius:50%}
.counter-circle div{position:relative;z-index:1}
.count{font-size:64px;font-weight:800}
.main-btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#0284c7);border:none;color:#fff;padding:18px;border-radius:18px;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
.reset{width:100%;background:transparent;border:1px solid rgba(255,255,255,0.15);color:#94a3b8;padding:12px;border-radius:14px;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>📿 عداد التسبيح</h1><div style="background:#1e3a5f;color:#7dd3fc;padding:6px 12px;border-radius:20px;font-size:12px">يعمل دون اتصال</div></div>
<div class="card">
<div class="azkar">
<button class="active" onclick="setZikr(this,'سبحان الله')">سبحان الله</button>
<button onclick="setZikr(this,'الحمد لله')">الحمد لله</button>
<button onclick="setZikr(this,'لا إله إلا الله')">لا إله إلا الله</button>
<button onclick="setZikr(this,'الله أكبر')">الله أكبر</button>
</div>
<div style="text-align:center;color:#e2e8f0;margin:8px 0" id="currentZikr">سبحان الله</div>
<div class="counter-circle" onclick="tasbeeh()">
<div class="count" id="count">0</div>
<div><span id="cycle">1</span> / الدورة</div>
</div>
<div style="text-align:center;color:#94a3b8;margin:12px 0"><span id="progress">0 / 33</span> • اضغط للعد</div>
<button class="main-btn" onclick="tasbeeh()">سبّح ✨</button>
<button class="reset" onclick="resetCounter()">إعادة تعيين</button>
</div>
<script>
let count=0,cycle=1,current='سبحان الله';let total=33;
function setZikr(el,zikr){document.querySelectorAll('.azkar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');current=zikr;document.getElementById('currentZikr').textContent=zikr;count=0;update()}
function tasbeeh(){count++;if(count>total){count=1;cycle++;if(navigator.vibrate)navigator.vibrate(50)}update()}
function update(){document.getElementById('count').textContent=count;document.getElementById('cycle').textContent=cycle;document.getElementById('progress').textContent=count+' / '+total}
function resetCounter(){count=0;cycle=1;update()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>

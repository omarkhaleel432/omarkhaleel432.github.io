/* ---------- helpers ---------- */
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function cleanStr(v,max){return typeof v==='string'?v.trim().slice(0,max):(typeof v==='number'&&isFinite(v)?String(v).slice(0,max):'')}
function todayKey(){let z=new Date(),y=z.getFullYear(),m=String(z.getMonth()+1).padStart(2,'0'),day=String(z.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function isDateKey(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))}

function defaultData(){return {country:'',region:'',city:'',name:'',budget:0,budgets:{EGP:0,SAR:0},expenses:[],orders:[],favs:[],added:[],...extraDefaults()}}

/* ---------- data sanitising (used for localStorage and for restored backups) ---------- */
function sanitizeData(raw){
  if(!isObj(raw))return defaultData();
  const out=defaultData();
  out.country=['EG','SA'].includes(raw.country)?raw.country:'';
  out.region=cleanStr(raw.region,80);out.city=cleanStr(raw.city,80);out.name=cleanStr(raw.name,60);
  if(out.country==='SA'&&out.region==='الشرقية')out.region='المنطقة الشرقية';
  const num=v=>{v=Number(v);return Number.isFinite(v)&&v>=0&&v<=MAX_AMOUNT?v:0};
  const rb=isObj(raw.budgets)?raw.budgets:null;
  out.budgets={EGP:num(rb&&rb.EGP),SAR:num(rb&&rb.SAR)};
  if(!rb&&num(raw.budget)>0)out.budgets[out.country==='SA'?'SAR':'EGP']=num(raw.budget);
  out.budget=out.budgets[out.country==='SA'?'SAR':'EGP'];
  const used=new Set(),uid=v=>{let n=Number(v);if(!Number.isFinite(n)||n<=0||used.has(n)){n=Date.now();while(used.has(n))n++}used.add(n);return n};
  const defCur=out.country==='SA'?'SAR':'EGP';
  out.expenses=(Array.isArray(raw.expenses)?raw.expenses:[]).filter(isObj).map(e=>{
    const a=Number(e.amount);if(!Number.isFinite(a)||a<=0||a>MAX_AMOUNT)return null;
    const cat=CATS.includes(e.cat)?e.cat:'أخرى';
    return {id:uid(e.id),amount:a,title:cleanStr(e.title,60)||cat,cat,date:isDateKey(e.date)?e.date:todayKey(),currency:['EGP','SAR'].includes(e.currency)?e.currency:defCur};
  }).filter(Boolean);
  out.orders=(Array.isArray(raw.orders)?raw.orders:[]).filter(isObj);
  demo.forEach(s=>used.add(s.id));
  out.added=(Array.isArray(raw.added)?raw.added:[]).filter(isObj).map(s=>{
    const name=cleanStr(s.name,60);if(!name)return null;
    const cat=SVC_CATS.includes(s.cat)?s.cat:'أخرى';
    return {id:uid(s.id),name,cat,icon:svcIcon(cat),desc:cleanStr(s.desc,120)||'نشاط مضاف',phone:cleanStr(s.phone,20),open:s.open!==false};
  }).filter(Boolean);
  const ids=new Set([...demo,...out.added].map(s=>s.id));
  out.favs=(Array.isArray(raw.favs)?raw.favs:[]).filter(x=>typeof x==='number'&&ids.has(x)).filter((x,i,a)=>a.indexOf(x)===i);
  sanitizeExtra(raw,out);
  return out;
}
function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultData();return sanitizeData(JSON.parse(raw))}catch(err){return defaultData()}}

const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MARKET_CATS=['أجهزة','أثاث','ملابس','سيارات','أخرى'],JOB_TYPES=['وظيفة','طلب شغل'],FOOD_CATS=['وجبات','مخبوزات','حلويات','مشروبات','أخرى'];
const EVENT_TYPES=[['birthday','🎂','عيد ميلاد'],['residency','🪪','تجديد إقامة'],['license','🚗','تجديد رخصة'],['doctor','🩺','موعد دكتور'],['other','📌','أخرى']];
function an(n){return String(n).replace(/\d/g,c=>'٠١٢٣٤٥٦٧٨٩'[c])}
function pad2(n){return String(n).padStart(2,'0')}
function keyOf(z){return z.getFullYear()+'-'+pad2(z.getMonth()+1)+'-'+pad2(z.getDate())}
function keyToDate(k){const p=String(k).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function addDays(k,n){const z=keyToDate(k);z.setDate(z.getDate()+n);return keyOf(z)}
function daysBetween(a,b){return Math.round((keyToDate(b)-keyToDate(a))/864e5)}
function dim(y,m){return new Date(y,m,0).getDate()}
function fmtDate(k){const z=keyToDate(k);return AR_DAYS[z.getDay()]+'، '+an(z.getDate())+' '+AR_MONTHS[z.getMonth()]}
function fmtTime(t){if(!t)return '';const p=t.split(':').map(Number),h=p[0],m=p[1];return an((h%12)||12)+':'+an(pad2(m))+(h<12?' ص':' م')}
function uid2(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function extraDefaults(){return {tasks:[],habits:[],notes:[],events:[],market:[],jobs:[],apps:[],homefood:[],settings:{tourDone:false,notif:false,lat:0,lng:0,method:''},cache:{},fired:{}}}
/* generic cleaners */
function N_(v,def,max){v=Number(v);return Number.isFinite(v)&&Math.abs(v)<=(max||1e12)?v:def}
function K_(v){return isDateKey(v)?v:''}
function T_(v){return typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v)?v:''}
function IMG_(v){return typeof v==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(v)&&v.length<700000?v:''}
function boolMap_(o){const r={};if(isObj(o))Object.keys(o).slice(0,6000).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&(o[k]===true||o[k]===1))r[k]=1});return r}
function list_(x,fn){const seen=new Set(),out=[];(Array.isArray(x)?x:[]).filter(isObj).slice(0,3000).forEach(o=>{let r;try{r=fn(o)}catch(e){r=null}if(!r)return;let id=(typeof o.id==='string'||typeof o.id==='number')&&/^[A-Za-z0-9_-]{1,39}$/.test(String(o.id))?String(o.id):'';if(!id||seen.has(id))id=uid2()+out.length;seen.add(id);r.id=id;out.push(r)});return out}
function sanitizeExtra(raw,out){
  const C=out.country,pick=(v,arr,def)=>arr.includes(v)?v:def,ctry=v=>['EG','SA'].includes(v)?v:C;
  out.tasks=list_(raw.tasks,t=>{const title=cleanStr(t.title,100);if(!title)return null;return {title,date:K_(t.date)||todayKey(),time:T_(t.time),notes:cleanStr(t.notes,300),repeat:pick(t.repeat,['none','daily','weekly','monthly'],'none'),remind:t.remind===true,done:boolMap_(t.done),created:N_(t.created,Date.now(),4e12)}});
  out.habits=list_(raw.habits,h=>{const name=cleanStr(h.name,40);if(!name)return null;return {name,icon:cleanStr(h.icon,4)||'⭐',checks:boolMap_(h.checks),created:N_(h.created,Date.now(),4e12)}});
  out.notes=list_(raw.notes,n=>{const text=cleanStr(n.text,3000);if(!text)return null;return {text,created:N_(n.created,Date.now(),4e12),updated:N_(n.updated,Date.now(),4e12)}});
  out.events=list_(raw.events,e=>{const title=cleanStr(e.title,100),date=K_(e.date);if(!title||!date)return null;return {title,date,time:T_(e.time),type:pick(e.type,EVENT_TYPES.map(x=>x[0]),'other'),repeat:e.repeat==='yearly'?'yearly':'none',remind:e.remind!==false}});
  out.market=list_(raw.market,m=>{const title=cleanStr(m.title,80);if(!title)return null;return {title,price:N_(m.price,0,1e9),desc:cleanStr(m.desc,400),phone:cleanStr(m.phone,20),cat:pick(m.cat,MARKET_CATS,'أخرى'),img:IMG_(m.img),country:ctry(m.country),ts:N_(m.ts,Date.now(),4e12)}});
  out.jobs=list_(raw.jobs,j=>{const title=cleanStr(j.title,80);if(!title)return null;return {title,kind:pick(j.kind,JOB_TYPES,'وظيفة'),company:cleanStr(j.company,60),desc:cleanStr(j.desc,400),phone:cleanStr(j.phone,20),country:ctry(j.country),ts:N_(j.ts,Date.now(),4e12)}});
  out.apps=list_(raw.apps,a=>{const jobId=cleanStr(a.jobId,40);if(!jobId)return null;return {jobId,jobTitle:cleanStr(a.jobTitle,80),name:cleanStr(a.name,60),phone:cleanStr(a.phone,20),msg:cleanStr(a.msg,300),ts:N_(a.ts,Date.now(),4e12)}});
  out.homefood=list_(raw.homefood,f=>{const title=cleanStr(f.title,80);if(!title)return null;return {title,price:N_(f.price,0,1e9),cook:cleanStr(f.cook,60),desc:cleanStr(f.desc,400),phone:cleanStr(f.phone,20),cat:pick(f.cat,FOOD_CATS,'وجبات'),img:IMG_(f.img),country:ctry(f.country),ts:N_(f.ts,Date.now(),4e12)}});
  const s=isObj(raw.settings)?raw.settings:{};
  out.settings={tourDone:s.tourDone===true,notif:s.notif===true,lat:N_(s.lat,0,90),lng:N_(s.lng,0,180),method:['','Egypt','Makkah','MWL','Karachi'].includes(s.method)?s.method:''};
  const c=isObj(raw.cache)?raw.cache:{},cc={};
  ['weather','rates','gold'].forEach(k=>{if(isObj(c[k])&&Number.isFinite(Number(c[k].ts))){const o={ts:Number(c[k].ts),demo:c[k].demo===true};Object.keys(c[k]).forEach(q=>{if(q!=='ts'&&q!=='demo'&&Number.isFinite(Number(c[k][q])))o[q]=Number(c[k][q])});cc[k]=o}});
  out.cache=cc;
  out.fired={};if(isObj(raw.fired))Object.keys(raw.fired).slice(-400).forEach(k=>{if(raw.fired[k]===1)out.fired[k]=1});
}

let d=loadData(),step=1,current='home',svcFilter='',navPushed=false,ignorePops=0,locBackup=null,lastDay='';
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return true}catch(err){console.warn('YOMAK save failed',err);return false}}
/* apply a change; if saving fails, roll the in-memory data back so memory never differs from storage */
function tx(fn){const snap=JSON.stringify(d);try{fn()}catch(err){d=JSON.parse(snap);return false}if(!save()){d=JSON.parse(snap);msg(SAVE_ERR);return false}return true}
function newId(){let n=Date.now();const used=new Set([...demo,...d.expenses,...d.added].map(x=>x.id));while(used.has(n))n++;return n}
function cur(){return d.country==='SA'?'SAR':'EGP'}
function budgetVal(){return Number(d.budgets&&d.budgets[cur()]||0)}
function cash(n,currency){const c=currency||cur();return Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+(c==='SAR'?' ر.س':' ج.م')}
function loc(){return [d.city,d.region].filter(Boolean).join('، ')}
function norm(s){return String(s||'').toLocaleLowerCase('ar').normalize('NFC').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ً-ٟـ]/g,'').replace(/\s+/g,' ').trim()}
function cities(q){let base=GEO[d.country]?.[d.region]||[];return base.filter(x=>norm(x).includes(norm(q)))}

  if(step===1)el('onContent').innerHTML=`<div class="choices"><button class="${d.country==='EG'?'selected':''}" onclick="pickCountry('EG')">🇪🇬<br>مصر</button><button class="${d.country==='SA'?'selected':''}" onclick="pickCountry('SA')">🇸🇦<br>السعودية</button></div>`;
  if(step===2)el('onContent').innerHTML=`<input class="input" placeholder="ابحث عن المحافظة أو المنطقة" aria-label="ابحث عن المحافظة أو المنطقة" oninput="options(this.value,2)"><div class="results" id="opts">${(d.country==='EG'?EG:SA).map(x=>option(x,2)).join('')}</div>`;

  el('next').textContent=step===4?'ابدأ يومك':'التالي';el('back').classList.toggle('hide',step===1);el('cancelLoc').classList.toggle('hide',!locBackup)}

/* ---------- backup / restore ---------- */
function exportBackup(){
  try{
    const payload={app:'YOMAK',backupVersion:1,exportedAt:new Date().toISOString(),data:d};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='yomak-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);msg('تم تجهيز النسخة الاحتياطية');
  }catch(err){msg('لم نتمكن من إنشاء النسخة. حاول مرة أخرى');}
}
function normalizeBackupData(raw){
  if(!isObj(raw))throw new Error('invalid');
  for(const key of ['expenses','orders','favs','added'])if(raw[key]!==undefined&&!Array.isArray(raw[key]))throw new Error('invalid-'+key);
  return sanitizeData(raw);
}
function afterRestore(){closeAllLayers();step=1;locBackup=null;if(d.name&&d.city)showApp();else showOn()}
function importBackup(file){
  if(!file)return;
  if(file.size>15*1024*1024){msg('حجم ملف النسخة أكبر من المسموح');return;}
  const reader=new FileReader();
  reader.onerror=()=>msg('تعذر قراءة الملف. تأكد أنه ملف نسخة يومك');
  reader.onload=()=>{
    let incoming;
    try{
      const parsed=JSON.parse(String(reader.result||'').replace(/^﻿/,''));
      if(!parsed||parsed.app!=='YOMAK'||parsed.backupVersion!==1||!parsed.data)throw new Error('format');
      incoming=normalizeBackupData(parsed.data);
    }catch(err){msg('الملف غير صالح أو ليس نسخة احتياطية من يومك');return;}
    if(!confirm('سيتم استبدال البيانات الحالية بالبيانات الموجودة في النسخة الاحتياطية. هل تريد المتابعة؟'))return;
    const previous=d;
    try{
      localStorage.setItem(UNDO_KEY,JSON.stringify(previous));
      d=incoming;
      if(!save()){d=previous;msg('لم نتمكن من حفظ الاسترجاع. بياناتك الحالية لم تتغير');return;}
      closeModal();afterRestore();msg('تم استرجاع النسخة الاحتياطية بنجاح');
    }catch(err){d=previous;try{save()}catch(e){}msg('تعذر استرجاع النسخة. بياناتك الحالية لم تتغير');}
  };
  try{reader.readAsText(file);}catch(err){msg('تعذر فتح الملف. حاول اختيار النسخة مرة أخرى');}
}
function undoRestore(){
  let raw=null;try{raw=localStorage.getItem(UNDO_KEY)}catch(e){}
  if(!raw)return msg('لا توجد نسخة سابقة للتراجع إليها');
  if(!confirm('سيتم استبدال البيانات الحالية بالبيانات التي كانت قبل آخر استرجاع. هل تريد المتابعة؟'))return;
  const previous=d;
  try{
    const inc=sanitizeData(JSON.parse(raw));
    localStorage.setItem(UNDO_KEY,JSON.stringify(previous));
    d=inc;
    if(!save()){d=previous;msg('لم نتمكن من حفظ التراجع. بياناتك الحالية لم تتغير');return;}
    afterRestore();msg('تم التراجع عن الاسترجاع');
  }catch(err){d=previous;msg('تعذر التراجع. بياناتك الحالية لم تتغير');}
}
function about(){openModal(`<button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><h3>يومك YOMAK</h3><p>كل احتياجات يومك في مكان واحد.</p><p class="muted">نسخة أولية 0.1. بيانات الأنشطة أمثلة، ولا توجد طلبات أو دفع أو تتبع مباشر حقيقي في النسخة الحالية.</p><button class="primary" onclick="closeModal()">تمام</button>`)}



/* ===== navigation layers (Android back), pages, forms, helpers ===== */
const layers=[],pageStack=[],PAGES={};
function pushLayer(t,replace){layers.push(t);try{replace?history.replaceState({y:t},''):history.pushState({y:t},'')}catch(e){}}
function hideModalEl(){el('modal').classList.add('hide')}
function openModal(s){el('sheet').innerHTML=s;el('sheet').scrollTop=0;el('modal').classList.remove('hide');if(!layers.includes('m'))pushLayer('m')}
function closeModal(fromPop){hideModalEl();const i=layers.lastIndexOf('m');if(i>=0){layers.splice(i,1);if(!fromPop){ignorePops++;try{history.back()}catch(e){ignorePops--}}}}
function closeTopLayer(fromPop){const t=layers.pop();if(!t)return;if(t==='m')hideModalEl();else if(t==='p'){pageStack.pop();renderPage()}if(!fromPop){ignorePops++;try{history.back()}catch(e){ignorePops--}}}
function closeAllLayers(){const n=layers.length;layers.length=0;pageStack.length=0;hideModalEl();renderPage();if(n){ignorePops++;try{history.go(-n)}catch(e){ignorePops--}}}
function backBtn(){if(layers.length)closeTopLayer(false);else go('home')}
window.addEventListener('popstate',()=>{if(ignorePops>0){ignorePops--;return}if(layers.length){closeTopLayer(true);return}if(navPushed){navPushed=false;go('home',true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layers.length)closeTopLayer(false)});
function msg(s){document.querySelectorAll('.toast').forEach(t=>t.remove());let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2100)}
function openPage(n,p){if(!PAGES[n])return;if(n==='calendar')cal.sel='';if(layers[layers.length-1]==='m'){hideModalEl();layers.pop();pageStack.push({n,p});pushLayer('p',true)}else{pageStack.push({n,p});pushLayer('p')}renderPage()}
function renderPage(){const pg=el('page');if(!pg)return;const t=pageStack[pageStack.length-1];if(!t){pg.classList.add('hide');pg.innerHTML='';document.body.classList.remove('nopage');return}
  const P=PAGES[t.n],old=pg.querySelector('.pbody'),sc=old?old.scrollTop:0,same=pg.dataset.n===t.n+'|'+pageStack.length;
  pg.dataset.n=t.n+'|'+pageStack.length;pg.classList.remove('hide');
  pg.innerHTML=`<div class="phead"><button class="pback" aria-label="رجوع" onclick="backBtn()">→</button><h2>${P.title(t.p)}</h2>${P.act?P.act(t.p):''}</div><div class="pbody">${P.render(t.p)}</div>`;
  if(same){const b=pg.querySelector('.pbody');if(b)b.scrollTop=sc}if(P.after)P.after(t.p)}
function curPage(){const t=pageStack[pageStack.length-1];return t?t.n:''}
function refresh(){render();renderPage()}
function go(t,fromPop){
  if(!fromPop){
    if(t!=='home'&&current==='home'&&!navPushed&&!layers.length){try{history.pushState({y:'t'},'')}catch(e){}navPushed=true}
    else if(t==='home'&&navPushed&&!layers.length){navPushed=false;ignorePops++;try{history.back()}catch(e){ignorePops--}}
  }
  current=t;
  if(t!=='services'){const s=el('search');if(s)s.value=''}
  document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false')});
  render();
}
/* ----- form helpers ----- */
let formFn=null,formDel=null,formImg='';
function val(id){const e=el(id);return e?String(e.value).trim():''}
function chkv(id){const e=el(id);return !!(e&&e.checked)}
function inp(id,label,v,o){o=o||{};const a=`id="${id}" class="input" aria-label="${esc(label)}" placeholder="${esc(o.ph||label)}"`;
  return `<label class="lbl" for="${id}">${esc(label)}</label>`+(o.area?`<textarea ${a} rows="${o.rows||3}" maxlength="${o.max||500}">${esc(v)}</textarea>`:`<input ${a} type="${o.type||'text'}" maxlength="${o.max||80}"${o.min!=null?` min="${o.min}"`:''}${o.hi!=null?` max="${o.hi}"`:''}${o.type==='number'?' step="any" inputmode="decimal"':''}${o.mode?` inputmode="${o.mode}"`:''} value="${esc(v)}">`)}
function selF(id,label,opts,v){return `<label class="lbl" for="${id}">${esc(label)}</label><select id="${id}" class="input" aria-label="${esc(label)}">${opts.map(o=>{const a=Array.isArray(o)?o:[o,o];return `<option value="${esc(a[0])}"${a[0]===v?' selected':''}>${esc(a[1])}</option>`}).join('')}</select>`}
function chkF(id,label,on){return `<label class="chkrow"><input type="checkbox" id="${id}"${on?' checked':''}><span>${esc(label)}</span></label>`}
function formModal(title,body,fn,o){o=o||{};formFn=fn;formDel=o.del||null;formImg=o.img||'';
  openModal(`<button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><h3>${title}</h3>${body}<button class="primary" style="margin-top:12px" onclick="runForm()">${o.save||'حفظ'}</button>${o.del?`<button class="secondary" style="margin-top:8px;color:#b0352d" onclick="runDel()">🗑 حذف</button>`:''}`)}
function runForm(){if(!formFn)return;const r=formFn();if(r===false)return;closeModal();refresh();if(typeof r==='string')msg(r)}
function runDel(){if(!formDel||!confirm('متأكد من الحذف؟'))return;const r=formDel();if(r===false)return;closeModal();refresh();msg(typeof r==='string'?r:'تم الحذف')}
function readImage(file,max,q){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error('type'));const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{const sc=Math.min(1,(max||720)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q||0.62))};im.src=fr.result};fr.readAsDataURL(file)})}
function imgField(id){return `<label class="lbl" for="${id}">صورة (اختياري)</label><input type="file" accept="image/*" id="${id}" class="input" onchange="pickImg(this)"><div id="${id}Prev">${formImg?`<img class="prev" alt="" src="${formImg}">`:''}</div>`}
function pickImg(inp){const f=inp.files&&inp.files[0];if(!f)return;readImage(f).then(u=>{formImg=u;const p=el(inp.id+'Prev');if(p)p.innerHTML=`<img class="prev" alt="" src="${u}"> <button class="secondary" type="button" onclick="formImg='';this.parentNode.innerHTML=''">إزالة الصورة</button>`}).catch(()=>msg('تعذر قراءة الصورة، جرّب صورة أخرى'))}

/* ===== يومي: tasks, habits, notes, calendar, alerts ===== */
function greet(){const h=new Date().getHours();return h<5?'ليلة سعيدة':h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير'}
function occursOn(t,k){if(k<t.date)return false;if(t.repeat==='none')return k===t.date;if(t.repeat==='daily')return true;const a=keyToDate(t.date),b=keyToDate(k);if(t.repeat==='weekly')return a.getDay()===b.getDay();if(t.repeat==='monthly')return b.getDate()===Math.min(a.getDate(),dim(b.getFullYear(),b.getMonth()+1));return false}
function eventOn(e,k){if(e.repeat!=='yearly')return e.date===k;const a=keyToDate(e.date),b=keyToDate(k);if(a.getMonth()!==b.getMonth())return false;return b.getDate()===Math.min(a.getDate(),dim(b.getFullYear(),b.getMonth()+1))}
function nextEventDate(e,k){if(e.repeat!=='yearly')return e.date>=k?e.date:null;const a=keyToDate(e.date),y=keyToDate(k).getFullYear();for(let yy=y;yy<=y+1;yy++){const day=Math.min(a.getDate(),dim(yy,a.getMonth()+1)),c=yy+'-'+pad2(a.getMonth()+1)+'-'+pad2(day);if(c>=k)return c}return null}
function tasksOn(k){return d.tasks.filter(t=>occursOn(t,k)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function eventsOn(k){return d.events.filter(e=>eventOn(e,k)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function evIcon(t){return (EVENT_TYPES.find(x=>x[0]===t)||EVENT_TYPES[4])[1]}
function repLabel(r){return r==='daily'?'يوميًا':r==='weekly'?'أسبوعيًا':r==='monthly'?'شهريًا':''}
function dailyLeft(){const b=budgetVal();if(!b)return null;const z=new Date();return b/dim(z.getFullYear(),z.getMonth()+1)-todaySpend()}
/* ---------- alerts / reminders ---------- */
const alertSources=[];
function computeAlerts(now){now=now||new Date();const tk=keyOf(now),mins=now.getHours()*60+now.getMinutes(),out=[];
  d.tasks.forEach(t=>{if(!t.remind||!t.time||!occursOn(t,tk)||t.done[tk])return;const p=t.time.split(':').map(Number),tm=p[0]*60+p[1];if(mins>=tm-60&&mins<=tm+120)out.push({key:'t:'+t.id+':'+tk,icon:'⏰',title:'تذكير بمهمة',text:t.title+' — '+(mins<tm?'بعد '+an(tm-mins)+' دقيقة':'الآن')})});
  d.events.forEach(e=>{if(!e.remind)return;const nx=nextEventDate(e,tk);if(!nx)return;const df=daysBetween(tk,nx);if(df===1)out.push({key:'e1:'+e.id+':'+nx,icon:evIcon(e.type),title:'تنبيه موعد',text:'غدًا: '+e.title});if(df===0)out.push({key:'e0:'+e.id+':'+nx,icon:evIcon(e.type),title:'موعد اليوم',text:'اليوم: '+e.title+(e.time?' — '+fmtTime(e.time):'')})});
  alertSources.forEach(f=>{try{f(now,tk,mins).forEach(a=>out.push(a))}catch(e){}});return out}
function canNotify(){return 'Notification' in window&&Notification.permission==='granted'&&d.settings.notif}
function notify(title,body,tag){if(!canNotify())return;try{const sw=navigator.serviceWorker;(sw&&sw.getRegistration?sw.getRegistration():Promise.resolve(null)).then(reg=>{if(reg&&reg.showNotification)reg.showNotification(title,{body,tag,icon:'icons/icon-192.png',dir:'rtl',lang:'ar'});else new Notification(title,{body,tag,dir:'rtl',lang:'ar'})}).catch(()=>{})}catch(e){}}
function enableNotif(){if(!('Notification' in window))return msg('الإشعارات غير مدعومة في هذا المتصفح');Notification.requestPermission().then(p=>{tx(()=>{d.settings.notif=p==='granted'});msg(p==='granted'?'تم تفعيل التنبيهات':'لم يتم السماح بالتنبيهات');refresh()})}
function disableNotif(){tx(()=>{d.settings.notif=false});refresh()}
function checkReminders(){if(!d.name)return;const fresh=computeAlerts().filter(a=>!d.fired[a.key]);if(!fresh.length)return;tx(()=>{fresh.forEach(a=>{d.fired[a.key]=1});const ks=Object.keys(d.fired);if(ks.length>400)ks.slice(0,ks.length-400).forEach(k=>delete d.fired[k])});fresh.forEach(a=>notify(a.title,a.text,a.key));if(current==='home'&&!layers.length)render()}
/* ---------- home "يومي" card ---------- */
function taskRow(t,k,small){const done=!!t.done[k];return `<div class="task${done?' done':''}"><button class="chk" aria-label="${done?'إلغاء الإنجاز':'تم'}" aria-pressed="${done}" onclick="toggleTask('${t.id}','${k}')">${done?'✓':''}</button><div class="tbody" role="button" tabindex="0" onclick="taskModal('${t.id}')" onkeydown="if(event.key==='Enter')taskModal('${t.id}')"><b>${esc(t.title)}</b><small>${[t.time?fmtTime(t.time):'',repLabel(t.repeat),t.remind&&t.time?'⏰':''].filter(Boolean).join(' · ')}</small></div></div>`}
function dayHome(){const k=todayKey(),ts=tasksOn(k),es=eventsOn(k),left=dailyLeft(),doneN=ts.filter(t=>t.done[k]).length,al=computeAlerts();
  return `${d.settings.tourDone?'':`<div class="card tour"><b>👋 أهلاً بيك في يومك</b><p class="muted">اضغط "كل الأقسام" لتشوف كل الميزات، أو "مساعدة" لشرح سريع.</p><div class="row"><button class="secondary" onclick="openPage('help')">مساعدة</button><button class="secondary" onclick="dismissTour()">تمام</button></div></div>`}
  ${al.length?`<div class="card alertbox" role="status">${al.map(a=>`<div class="alrt"><span>${a.icon}</span><span>${esc(a.text)}</span></div>`).join('')}</div>`:''}
  <div class="card daycard"><div class="hello2">${greet()} يا ${esc(d.name)} ☀️</div><div class="muted">${fmtDate(k)}</div>
  <div class="stats"><div><small>مهام النهاردة</small><b>${an(doneN)}/${an(ts.length)}</b></div><div><small>مواعيد النهاردة</small><b>${an(es.length)}</b></div><div><small>صرفت النهاردة</small><b>${cash(todaySpend())}</b></div><div><small>فاضل من ميزانية اليوم</small><b class="${left!==null&&left<0?'neg':''}">${left===null?'<a onclick="budgetModal()" role="button" tabindex="0">حدد الميزانية</a>':cash(left)}</b></div></div>
  ${es.length?`<div class="sub2">مواعيد</div>${es.map(e=>`<div class="task"><span class="eic">${evIcon(e.type)}</span><div class="tbody" role="button" tabindex="0" onclick="eventModal('${e.id}')"><b>${esc(e.title)}</b><small>${e.time?fmtTime(e.time):'طول اليوم'}</small></div></div>`).join('')}`:''}
  <div class="sub2">مهام النهاردة</div>${ts.length?ts.slice(0,5).map(t=>taskRow(t,k)).join('')+(ts.length>5?`<button class="secondary" onclick="openPage('tasks')">عرض كل المهام (${an(ts.length)})</button>`:''):'<div class="muted" style="padding:6px 2px">مفيش مهام النهاردة ✨</div>'}
  <button class="primary" style="margin-top:10px" onclick="taskModal()">＋ أضف مهمة</button></div>
  <div class="section"><h3>أقسامك</h3><button onclick="openPage('hub')">كل الأقسام</button></div>${hubGrid(['tasks','habits','notes','calendar','prayer','adhkar','live','market'])}${prayerWidget()}${verseCard()}`}
function dismissTour(){tx(()=>{d.settings.tourDone=true});render()}
/* ---------- tasks ---------- */
function toggleTask(id,k){const t=d.tasks.find(x=>x.id===id);if(!t)return;tx(()=>{if(t.done[k])delete t.done[k];else t.done[k]=1});refresh()}
function taskModal(id,dateKey){const t=id?d.tasks.find(x=>x.id===id):null;if(id&&!t)return;
  formModal(t?'تعديل مهمة':'إضافة مهمة',inp('tTitle','عنوان المهمة',t&&t.title,{max:100})+inp('tDate','التاريخ',t?t.date:(dateKey||todayKey()),{type:'date'})+inp('tTime','الوقت (اختياري)',t&&t.time,{type:'time'})+selF('tRep','التكرار',[['none','مرة واحدة'],['daily','يوميًا'],['weekly','أسبوعيًا'],['monthly','شهريًا']],t?t.repeat:'none')+chkF('tRem','ذكّرني قبل الموعد بساعة (محتاج وقت)',t?t.remind:false)+inp('tNotes','ملاحظات',t&&t.notes,{area:1,max:300,rows:2}),
  ()=>{const title=val('tTitle'),date=val('tDate'),time=val('tTime');if(!title){msg('اكتب عنوان المهمة');return false}if(!isDateKey(date)){msg('اختار تاريخ صحيح');return false}if(chkv('tRem')&&!time){msg('اختار وقت علشان التذكير');return false}
    const o={title,date,time,repeat:val('tRep'),remind:chkv('tRem'),notes:val('tNotes')};
    if(!tx(()=>{if(t){const x=d.tasks.find(q=>q.id===id);Object.assign(x,o)}else d.tasks.push({...o,id:uid2(),done:{},created:Date.now()})}))return false;return t?'تم تعديل المهمة':'تمت إضافة المهمة'},
  t?{del:()=>{if(!tx(()=>{d.tasks=d.tasks.filter(x=>x.id!==id)}))return false;return 'تم حذف المهمة'}}:{})}
PAGES.tasks={title:()=>'المهام ✅',act:()=>`<button class="pact" onclick="taskModal()">＋ مهمة</button>`,render:()=>{const k=todayKey();let h=`<div class="sub2">النهاردة · ${fmtDate(k)}</div>`;const ts=tasksOn(k);h+=ts.length?ts.map(t=>taskRow(t,k)).join(''):'<div class="card empty">مفيش مهام النهاردة</div>';
  for(let i=1;i<=7;i++){const kk=addDays(k,i),l=tasksOn(kk);if(l.length)h+=`<div class="sub2">${fmtDate(kk)}</div>`+l.map(t=>taskRow(t,kk)).join('')}return h}};
/* ---------- habits ---------- */
function streakOf(h){let k=todayKey();if(!h.checks[k])k=addDays(k,-1);let n=0;while(h.checks[k]){n++;k=addDays(k,-1)}return n}
function habitPoints(h){const ks=Object.keys(h.checks).sort();let pts=ks.length*5,run=0,prev='';ks.forEach(k=>{run=(prev&&addDays(prev,1)===k)?run+1:1;if(run%7===0)pts+=20;prev=k});return pts}
function totalPoints(){return d.habits.reduce((s,h)=>s+habitPoints(h),0)}
function dayWord(n){return n===1?'يوم واحد':n===2?'يومين':n<=10?an(n)+' أيام':an(n)+' يومًا'}
function toggleHabit(id){const h=d.habits.find(x=>x.id===id);if(!h)return;const k=todayKey();tx(()=>{if(h.checks[k])delete h.checks[k];else h.checks[k]=1});refresh()}
function habitModal(id){const h=id?d.habits.find(x=>x.id===id):null;if(id&&!h)return;
  formModal(h?'تعديل عادة':'إضافة عادة',`<div class="chips">${[['صلاة','🕌'],['رياضة','🏃'],['قراءة','📖'],['توفير','💰']].map(p=>`<button type="button" class="chip" onclick="el('hName').value='${p[0]}';el('hIcon').value='${p[1]}'">${p[1]} ${p[0]}</button>`).join('')}</div>`+inp('hName','اسم العادة',h&&h.name,{max:40})+inp('hIcon','أيقونة',h?h.icon:'⭐',{max:4}),
  ()=>{const n=val('hName');if(!n){msg('اكتب اسم العادة');return false}const ic=val('hIcon')||'⭐';if(!tx(()=>{if(h){const x=d.habits.find(q=>q.id===id);x.name=n;x.icon=ic}else d.habits.push({id:uid2(),name:n,icon:ic,checks:{},created:Date.now()})}))return false;return h?'تم التعديل':'تمت إضافة العادة'},
  h?{del:()=>{if(!tx(()=>{d.habits=d.habits.filter(x=>x.id!==id)}))return false;return 'تم حذف العادة'}}:{})}
PAGES.habits={title:()=>'عاداتي 🔥',act:()=>`<button class="pact" onclick="habitModal()">＋ عادة</button>`,render:()=>{const k=todayKey();let h=`<div class="card pts"><small>نقاطي</small><b>⭐ ${an(totalPoints())}</b></div>`;
  h+=d.habits.length?d.habits.map(x=>{const n=streakOf(x),done=!!x.checks[k];let wk='';for(let i=6;i>=0;i--)wk+=`<i class="dot${x.checks[addDays(k,-i)]?' on':''}"></i>`;return `<div class="card habit"><div class="row between"><div><b>${esc(x.icon)} ${esc(x.name)}</b><small class="muted">${n?'🔥 بقالك '+dayWord(n)+' متواصل':'ابدأ النهاردة'} · ⭐ ${an(habitPoints(x))}</small><div class="wk">${wk}</div></div><div class="row"><button class="chk big" aria-label="تعليم اليوم" aria-pressed="${done}" onclick="toggleHabit('${x.id}')">${done?'✓':''}</button><button class="pact" aria-label="تعديل" onclick="habitModal('${x.id}')">⋯</button></div></div></div>`}).join(''):'<div class="card empty">ضيف أول عادة: صلاة، رياضة، قراءة، توفير…</div>';return h}};
/* ---------- notes ---------- */
let noteQ='';
function noteListHtml(){const q=norm(noteQ),l=d.notes.filter(n=>!q||norm(n.text).includes(q)).sort((a,b)=>b.updated-a.updated);return l.length?l.map(n=>`<div class="card note" role="button" tabindex="0" onclick="noteModal('${n.id}')" onkeydown="if(event.key==='Enter')noteModal('${n.id}')"><div class="ntext">${esc(n.text)}</div><small class="muted">${fmtDate(keyOf(new Date(n.updated)))}</small></div>`).join(''):`<div class="card empty">${q?'مفيش نتائج':'مفيش نوتات لسه ✍️'}</div>`}
function noteSearch(v){noteQ=v;const l=el('noteList');if(l)l.innerHTML=noteListHtml()}

const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI,sinD=x=>Math.sin(rad(x)),cosD=x=>Math.cos(rad(x)),tanD=x=>Math.tan(rad(x));
const fixA=a=>{a=a-360*Math.floor(a/360);return a},fixH=a=>{a=a-24*Math.floor(a/24);return a};
function julian(y,m,dd){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+dd+B-1524.5}
function sunPos(jd){const D=jd-2451545.0,g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D),L=fixA(q+1.915*sinD(g)+0.020*sinD(2*g)),e=23.439-0.00000036*D,RA=fixH(deg(Math.atan2(cosD(e)*sinD(L),cosD(L)))/15);return {decl:deg(Math.asin(sinD(e)*sinD(L))),eqt:q/15-RA}}

  const mid=t=>fixH(12-sunPos(jd+t).eqt),ang=(a,t,ccw)=>{const dc=sunPos(jd+t).decl,x=(-sinD(a)-sinD(dc)*sinD(lat))/(cosD(dc)*cosD(lat)),h=deg(Math.acos(x))/15;return mid(t)+(ccw?-h:h)},
  asr=(f,t)=>{const dc=sunPos(jd+t).decl,a=-deg(Math.atan(1/(f+tanD(Math.abs(lat-dc)))));return ang(a,t,false)};
  const adj=tz-lng/15;let fajr=ang(P.f,5/24,true)+adj,sunrise=ang(0.833,6/24,true)+adj,dhuhr=mid(12/24)+adj+1/60,as=asr(1,13/24)+adj,maghrib=ang(0.833,18/24,false)+adj,isha=P.im?maghrib+P.im/60:ang(P.i,18/24,false)+adj;
  return {fajr,sunrise,dhuhr,asr:as,maghrib,isha}}

function adTabSet(t){adTab=t;renderPage()}
PAGES.adhkar={title:()=>'الأذكار 📿',render:()=>`<div class="seg">${[['morning','☀️ الصباح'],['evening','🌙 المساء'],['after','🕌 بعد الصلاة']].map(x=>`<button class="${adTab===x[0]?'on':''}" onclick="adTabSet('${x[0]}')">${x[1]}</button>`).join('')}</div>`+ADHKAR[adTab].map((a,i)=>{const c=adhkarCnt[adKey(i)]||0,done=c>=a[2];return `<div class="card dhk${done?' done':''}" role="button" tabindex="0" onclick="adTap(${i})">${a[0]?`<b>${a[0]}</b>`:''}<div class="atext">${a[1]}</div><div class="row between"><small class="muted">اضغط للعد</small><span class="pill">${an(c)}/${an(a[2])}${done?' ✓':''}</span></div></div>`}).join('')+`<p class="muted">العدّاد للجلسة الحالية فقط.</p>`};
const VERSES=[['إِنَّ مَعَ الْعُسْرِ يُسْرًا','الشرح: 6'],['وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا * وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ','الطلاق: 2-3'],['أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ','الرعد: 28'],['وَقُل رَّبِّ زِدْنِي عِلْمًا','طه: 114'],['إِنَّ اللَّهَ مَعَ الصَّابِرِينَ','البقرة: 153'],['فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ','البقرة: 152'],['وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ','الضحى: 5'],['وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ','الطلاق: 3'],['لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا','البقرة: 286'],['ادْعُونِي أَسْتَجِبْ لَكُمْ','غافر: 60'],['وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ','الحديد: 4'],['فَاصْبِرْ صَبْرًا جَمِيلًا','المعارج: 5']];
const DUAS=['رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ (البقرة: 201)','رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي (طه: 25-26)','اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا','يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَىٰ دِينِكَ','اللَّهُمَّ أَعِنِّي عَلَىٰ ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ','اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ','اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ','رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا (البقرة: 286)'];
function dayIdx(){const z=new Date();return Math.floor((Date.UTC(z.getFullYear(),z.getMonth(),z.getDate())-Date.UTC(z.getFullYear(),0,0))/864e5)}
function verseCard(){const v=VERSES[dayIdx()%VERSES.length],du=DUAS[dayIdx()%DUAS.length];return `<div class="card verse"><small class="muted">آية اليوم</small><div class="atext">﴿${v[0]}﴾ <small>(${v[1]})</small></div><small class="muted">دعاء اليوم</small><div class="atext">${du}</div></div>`}
/* ---------- live data: DEMO placeholders until trusted sources are verified ---------- */
const DEMO_LIVE={weather:{temp:24,min:17,max:27,code:0},rates:{SAR_EGP:13.0},gold:{g24:300,cur:'SAR'}};
const WCODE=c=>c===0?'صافي ☀️':c<=3?'غائم جزئيًا ⛅':c<=48?'ضباب 🌫️':c<=67?'أمطار 🌧️':c<=77?'ثلوج ❄️':c<=82?'زخات 🌦️':'عواصف ⛈️';
function liveGet(k){const c=d.cache[k];return c?{...c,manual:!c.demo}:{...DEMO_LIVE[k],ts:0,demo:true,manual:false}}
function liveBadge(o){return o.demo?'<span class="pill demo">تجريبي</span>':'<span class="pill">يدوي · '+an(fmtDate(keyOf(new Date(o.ts))))+'</span>'}
function goldRows(o){const cur=d.country==='SA'?'SAR':'EGP',r=liveGet('rates').SAR_EGP,g=cur===o.cur?o.g24:(cur==='EGP'?o.g24*r:o.g24/r);return [['عيار 24',g],['عيار 21',g*21/24],['عيار 18',g*18/24]].map(x=>`<div class="pr"><span>${x[0]} (جرام)</span><b>${cash(Math.round(x[1]*100)/100,cur)}</b></div>`).join('')+(cur==='EGP'?`<div class="pr"><span>جنيه ذهب (٨ جم عيار 21)</span><b>${cash(Math.round(g*21/24*8),cur)}</b></div>`:'')}
function liveModal(k){const o=liveGet(k);
  const f={weather:()=>inp('lTemp','درجة الحرارة',o.temp,{type:'number'}),rates:()=>inp('lRate','١ ريال = كام جنيه',o.SAR_EGP,{type:'number'}),gold:()=>inp('lGold','سعر جرام عيار 24 بعملة '+(o.cur==='SAR'?'الريال':'الجنيه'),o.g24,{type:'number'})}[k]();
  formModal('تعديل يدوي',f+'<p class="muted">القيمة تُحفظ كإدخال يدوي منك إلى أن يتم ربط مصدر موثوق.</p>',()=>{const n=Number(val(k==='weather'?'lTemp':k==='rates'?'lRate':'lGold'));if(!Number.isFinite(n)||(k!=='weather'&&n<=0)){msg('أدخل رقم صحيح');return false}
    return tx(()=>{const prev=liveGet(k),c={...prev,ts:Date.now(),demo:false};delete c.manual;if(k==='weather')c.temp=n;if(k==='rates')c.SAR_EGP=n;if(k==='gold')c.g24=n;d.cache[k]=c})?'تم الحفظ':false})}
function resetLive(k){tx(()=>{delete d.cache[k]});refresh()}
PAGES.live={title:()=>'الطقس والأسعار 🌤️',render:()=>{const w=liveGet('weather'),r=liveGet('rates'),g=liveGet('gold'),c=coords();return `<div class="card"><div class="row between"><b>🌤️ الطقس · ${esc(c.src)}</b>${liveBadge(w)}</div><div class="big2">${an(Math.round(w.temp))}° ${WCODE(w.code||0)}</div><small class="muted">العظمى ${an(w.max)}° · الصغرى ${an(w.min)}°</small><div class="row"><button class="secondary" onclick="liveModal('weather')">تعديل يدوي</button>${w.manual?`<button class="secondary" onclick="resetLive('weather')">رجوع للتجريبي</button>`:''}</div></div>
  <div class="card"><div class="row between"><b>💱 الريال والجنيه</b>${liveBadge(r)}</div><div class="big2">١ ر.س = ${cash(r.SAR_EGP,'EGP')}</div><div class="row"><button class="secondary" onclick="liveModal('rates')">تعديل يدوي</button>${r.manual?`<button class="secondary" onclick="resetLive('rates')">رجوع للتجريبي</button>`:''}</div></div>
  <div class="card"><div class="row between"><b>🥇 الذهب</b>${liveBadge(g)}</div>${goldRows(g)}<div class="row"><button class="secondary" onclick="liveModal('gold')">تعديل يدوي</button>${g.manual?`<button class="secondary" onclick="resetLive('gold')">رجوع للتجريبي</button>`:''}</div></div>
  <p class="muted">⚠️ الأرقام المكتوب عليها "تجريبي" ليست أسعارًا حقيقية. سيتم ربط مصادر رسمية موثوقة لاحقًا بعد التحقق منها، ولا تعتمد عليها في أي قرار مالي.</p>`}};

function useMyLocation(){if(!navigator.geolocation)return msg('تحديد الموقع غير مدعوم');navigator.geolocation.getCurrentPosition(p=>{tx(()=>{d.settings.lat=Math.round(p.coords.latitude*1e4)/1e4;d.settings.lng=Math.round(p.coords.longitude*1e4)/1e4});msg('تم تحديد موقعك');refresh()},()=>msg('لم يتم السماح بتحديد الموقع'),{timeout:10000,maximumAge:600000})}
function clearMyLocation(){tx(()=>{d.settings.lat=0;d.settings.lng=0});refresh()}

  <div class="card"><b>📍 الموقع لمواقيت الصلاة</b><p class="muted">الحالي: ${esc(c.src)} (${an(c.lat)}, ${an(c.lng)})</p><button class="secondary" onclick="useMyLocation()">استخدم موقعي الحالي</button>${d.settings.lat||d.settings.lng?`<button class="secondary" style="margin-top:8px" onclick="clearMyLocation()">رجوع لموقع مدينتي</button>`:''}</div>
  <div class="card">${selF('stMethod','طريقة حساب الصلاة',[['','تلقائي حسب الدولة'],['Egypt','الهيئة المصرية'],['Makkah','أم القرى'],['MWL','رابطة العالم الإسلامي'],['Karachi','كراتشي']],d.settings.method).replace('<select ','<select onchange="setMethod(this.value)" ')}</div>`}};
function extraProfileItems(){return `<button class="service" onclick="openPage('hub')"><span class="icon">🧭</span><span><b>كل الأقسام</b><small>كل ميزات يومك في مكان واحد</small></span></button><button class="service" onclick="openPage('settings')"><span class="icon">⚙️</span><span><b>الإعدادات</b><small>التنبيهات والموقع وطريقة الصلاة</small></span></button><button class="service" onclick="openPage('help')"><span class="icon">❓</span><span><b>مساعدة</b><small>شرح سريع لاستخدام التطبيق</small></span></button>`}

/* ===== local markets (per country, this device only): used market, jobs, home food ===== */
const mq={market:'',jobs:'',homefood:''},mcat={market:'',jobs:'',homefood:''};
function mine(arr){return arr.filter(x=>x.country===d.country).sort((a,b)=>b.ts-a.ts)}
function priceTxt(p){return p>0?cash(p):'السعر بالاتفاق'}
function mFilter(k,arr,fields,catKey){const q=norm(mq[k]),c=mcat[k];return mine(arr).filter(x=>(!c||x[catKey]===c)&&(!q||norm(fields(x)).includes(q)))}
function mChips(k,cats){return `<div class="chips"><button class="chip${mcat[k]?'':' on'}" onclick="mSetCat('${k}','')">الكل</button>${cats.map(c=>`<button class="chip${mcat[k]===c?' on':''}" onclick="mSetCat('${k}','${c}')">${c}</button>`).join('')}</div>`}
function mSetCat(k,c){mcat[k]=c;renderPage()}
function mSearch(k,v){mq[k]=v;const l=el('mList');if(l)l.innerHTML=({market:marketListHtml,jobs:jobsListHtml,homefood:foodListHtml})[k]()}
function mSearchBox(k){return `<input class="input" id="mQ" placeholder="ابحث" aria-label="ابحث" value="${esc(mq[k])}" oninput="mSearch('${k}',this.value)">`}
function localNote(){return `<p class="muted">📍 سوق ${d.country==='SA'?'السعودية':'مصر'} — محلي على جهازك فقط. ${''}العروض لا تظهر لمستخدمين آخرين قبل ربط السيرفر.</p>`}
/* --- used market --- */
function marketListHtml(){const l=mFilter('market',d.market,x=>x.title+' '+x.desc+' '+x.cat,'cat');return l.length?`<div class="mgrid">${l.map(x=>`<button class="mcard" onclick="marketView('${x.id}')">${x.img?`<img class="thumb" alt="" src="${x.img}">`:'<div class="thumb ph">🛍️</div>'}<b>${esc(x.title)}</b><span class="price">${priceTxt(x.price)}</span><small class="muted">${esc(x.cat)}</small></button>`).join('')}</div>`:`<div class="card empty">${mq.market||mcat.market?'مفيش نتائج':'مفيش منتجات لسه. اضغط ＋ لإضافة أول منتج'}</div>`}
function marketView(id){const x=d.market.find(q=>q.id===id);if(!x)return;openModal(`<button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><h3>${esc(x.title)}</h3>${x.img?`<img class="prev big" alt="" src="${x.img}">`:''}<div class="price">${priceTxt(x.price)}</div><p class="muted">${esc(x.cat)}</p><p>${esc(x.desc)||'—'}</p>${x.phone?`<p>${ph(x.phone,true)}</p>`:''}<button class="secondary" onclick="marketModal('${x.id}')">✎ تعديل</button><button class="secondary" style="margin-top:8px;color:#b0352d" onclick="marketSold('${x.id}')">✅ تم البيع (حذف المنتج)</button>`)}
function marketSold(id){if(!confirm('تم بيع المنتج؟ سيتم حذفه من السوق.'))return;if(!tx(()=>{d.market=d.market.filter(x=>x.id!==id)}))return;closeModal();refresh();msg('تم حذف المنتج بعد البيع')}
function marketModal(id){const x=id?d.market.find(q=>q.id===id):null;if(id&&!x)return;
  formModal(x?'تعديل منتج':'إضافة منتج',inp('mTitle','اسم المنتج',x&&x.title,{max:80})+inp('mPrice','السعر ('+(cur()==='SAR'?'ريال':'جنيه')+')',x?x.price||'':'',{type:'number',min:0})+selF('mCat','القسم',MARKET_CATS,x?x.cat:'أخرى')+inp('mDesc','الوصف',x&&x.desc,{area:1,max:400})+inp('mPhone','رقم التواصل',x&&x.phone,{type:'tel',max:20,mode:'tel'})+imgField('mImg'),
  ()=>{const title=val('mTitle');if(!title){msg('اكتب اسم المنتج');return false}const price=val('mPrice')===''?0:Number(val('mPrice'));if(!Number.isFinite(price)||price<0||price>1e9){msg('السعر غير صحيح');return false}
    const o={title,price,cat:val('mCat'),desc:val('mDesc'),phone:val('mPhone'),img:formImg};
    if(!tx(()=>{if(x)Object.assign(d.market.find(q=>q.id===id),o);else d.market.push({...o,id:uid2(),country:d.country,ts:Date.now()})}))return false;return x?'تم تعديل المنتج':'تمت إضافة المنتج'},{img:x?x.img:''})}
PAGES.market={title:()=>'سوق مستعمل 🛍️',act:()=>`<button class="pact" onclick="marketModal()">＋ منتج</button>`,render:()=>localNote()+mSearchBox('market')+mChips('market',MARKET_CATS)+`<div id="mList">${marketListHtml()}</div>`};
/* --- jobs --- */
function jobsListHtml(){const l=mFilter('jobs',d.jobs,x=>x.title+' '+x.company+' '+x.desc,'kind');return l.length?`<div class="list">${l.map(x=>{const n=d.apps.filter(a=>a.jobId===x.id).length;return `<button class="service" onclick="jobView('${x.id}')"><span class="icon">${x.kind==='وظيفة'?'💼':'🙋'}</span><span style="flex:1"><b>${esc(x.title)}</b><small>${esc(x.kind)}${x.company?' · '+esc(x.company):''}${n?' · تقديمات: '+an(n):''}</small></span></button>`}).join('')}</div>`:`<div class="card empty">${mq.jobs||mcat.jobs?'مفيش نتائج':'مفيش وظايف لسه. اضغط ＋ لإضافة وظيفة أو طلب شغل'}</div>`}
function jobView(id){const x=d.jobs.find(q=>q.id===id);if(!x)return;const myApps=d.apps.filter(a=>a.jobId===id);
  openModal(`<button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><h3>${esc(x.title)}</h3><p class="muted">${esc(x.kind)}${x.company?' · '+esc(x.company):''} · ${fmtDate(keyOf(new Date(x.ts)))}</p><p>${esc(x.desc)||'—'}</p>${x.phone?`<p>${ph(x.phone,true)}</p>`:''}${x.kind==='وظيفة'?`<button class="primary" onclick="applyModal('${x.id}')">قدّم على الوظيفة</button>`:''}${myApps.length?`<div class="sub2">تقديماتي (${an(myApps.length)})</div>${myApps.map(a=>`<div class="card"><b>${esc(a.name)}</b> <small class="muted">${esc(a.phone)}</small><p class="muted">${esc(a.msg)}</p></div>`).join('')}`:''}<button class="secondary" style="margin-top:8px" onclick="jobModal('${x.id}')">✎ تعديل</button>`)}
function applyModal(id){const x=d.jobs.find(q=>q.id===id);if(!x)return;formModal('التقديم على: '+esc(x.title),inp('aName','اسمك',d.name,{max:60})+inp('aPhone','رقم التواصل','',{type:'tel',max:20,mode:'tel'})+inp('aMsg','رسالة قصيرة','',{area:1,max:300,rows:3}),()=>{const name=val('aName'),phone=val('aPhone');if(!name||!phone){msg('اكتب الاسم ورقم التواصل');return false}if(!tx(()=>{d.apps.push({id:uid2(),jobId:id,jobTitle:x.title,name,phone,msg:val('aMsg'),ts:Date.now()})}))return false;return 'تم تسجيل التقديم على جهازك'},{save:'إرسال التقديم'})}
function jobModal(id){const x=id?d.jobs.find(q=>q.id===id):null;if(id&&!x)return;
  formModal(x?'تعديل':'إضافة وظيفة / طلب شغل',selF('jKind','النوع',JOB_TYPES,x?x.kind:'وظيفة')+inp('jTitle','المسمى / المهنة',x&&x.title,{max:80})+inp('jCompany','الشركة أو الاسم',x&&x.company,{max:60})+inp('jDesc','التفاصيل',x&&x.desc,{area:1,max:400})+inp('jPhone','رقم التواصل',x&&x.phone,{type:'tel',max:20,mode:'tel'}),
  ()=>{const title=val('jTitle');if(!title){msg('اكتب المسمى');return false}const o={title,kind:val('jKind'),company:val('jCompany'),desc:val('jDesc'),phone:val('jPhone')};if(!tx(()=>{if(x)Object.assign(d.jobs.find(q=>q.id===id),o);else d.jobs.push({...o,id:uid2(),country:d.country,ts:Date.now()})}))return false;return x?'تم التعديل':'تمت الإضافة'},
  x?{del:()=>{if(!tx(()=>{d.jobs=d.jobs.filter(q=>q.id!==id)}))return false;return 'تم حذف الإعلان'}}:{})}
PAGES.jobs={title:()=>'سوق شغل 💼',act:()=>`<button class="pact" onclick="jobModal()">＋ إعلان</button>`,render:()=>localNote()+mSearchBox('jobs')+mChips('jobs',JOB_TYPES)+`<div id="mList">${jobsListHtml()}</div>`};
/* --- home food --- */
function foodListHtml(){const l=mFilter('homefood',d.homefood,x=>x.title+' '+x.cook+' '+x.desc,'cat');return l.length?`<div class="mgrid">${l.map(x=>`<button class="mcard" onclick="foodView('${x.id}')">${x.img?`<img class="thumb" alt="" src="${x.img}">`:'<div class="thumb ph">🍲</div>'}<b>${esc(x.title)}</b><span class="price">${priceTxt(x.price)}</span><small class="muted">${esc(x.cook)}</small></button>`).join('')}</div>`:`<div class="card empty">${mq.homefood||mcat.homefood?'مفيش نتائج':'مفيش أكل بيتي لسه. اضغط ＋ لعرض أكلك'}</div>`}

/* ===== شات خاص بين شخصين ===== */
cl.ctab='groups';cl.dm=null;cl.dmMsgs=null;cl.dmLast=0;
async function loadDms(){try{cl.dm=await sb('/rest/v1/dm_chats?select=id,user_a,user_b,a:profiles!dm_chats_user_a_fkey(name),b:profiles!dm_chats_user_b_fkey(name)&order=created_at.desc&limit=100')}catch(e){cl.dm=[];cl.err=sbErr(e);msg(sbErr(e).slice(0,90))}if(curPage()==='chat')renderPage()}
function dmName(x){const s=cs();const o=s&&x.user_a===s.uid?x.b:x.a;return (o&&o.name)||'مستخدم'}
function setCtab(t){cl.ctab=t;renderPage()}
function dmModal(){formModal('محادثة خاصة جديدة',inp('dQ','ابحث باسم الشخص','',{max:40})+'<button class="secondary" type="button" style="margin-top:8px" onclick="findPeople()">بحث</button><div id="dRes"></div><p id="dErr" class="muted" style="color:#b0352d;overflow-wrap:anywhere"></p>',()=>{findPeople();return false},{save:'بحث'})}
async function findPeople(){const q=val('dQ').replace(/[%*,()]/g,' ').trim(),s=cs();if(q.length<2){msg('اكتب حرفين على الأقل');return}
  try{const r=await sb('/rest/v1/profiles?select=id,name,country&name=ilike.*'+encodeURIComponent(q)+'*&id=neq.'+s.uid+'&limit=20');const b=el('dRes');if(!b)return;
    b.innerHTML=r&&r.length?r.map(x=>`<button class="mcard" style="width:100%;margin-top:6px" data-id="${esc(x.id)}" data-nm="${esc(x.name)}" onclick="startDm(this.dataset.id,this.dataset.nm)"><b>${esc(x.name)}</b> <span class="muted">${x.country==='SA'?'🇸🇦':x.country==='EG'?'🇪🇬':''}</span></button>`).join(''):'<p class="muted">لا توجد نتائج</p>'}catch(e){showErr('dErr',e)}}
async function startDm(other,name){if(banStop())return;const s=cs();if(!s||!/^[0-9a-f-]{36}$/i.test(other))return;const [a,b]=s.uid<other?[s.uid,other]:[other,s.uid];
  try{await ensureProfile();let r=await sb('/rest/v1/dm_chats?select=id&user_a=eq.'+a+'&user_b=eq.'+b);let id=r&&r[0]&&r[0].id;
    if(!id){r=await sb('/rest/v1/dm_chats',{method:'POST',prefer:'return=representation',body:{user_a:a,user_b:b}});id=r&&r[0]&&r[0].id}
    if(!id)throw {message:'تعذر بدء المحادثة'};cl.dm=null;cl.dmMsgs=null;cl.dmLast=0;openPage('dm',{id,name})}catch(e){showErr('dErr',e)}}
PAGES.chat={title:()=>'الشات',act:()=>cs()&&cl.ctab==='dm'?`<button class="pact" onclick="dmModal()">＋ خاص</button>`:'',render:()=>{if(!cs())return authCard();
  const tabs=`<div class="seg"><button class="${cl.ctab==='groups'?'on':''}" onclick="setCtab('groups')">👥 شات الجروبات</button><button class="${cl.ctab==='dm'?'on':''}" onclick="setCtab('dm')">👤 شات خاص</button></div>`;
  if(cl.ctab==='dm'){const l=cl.dm;return tabs+whoBar()+`<button class="primary" onclick="dmModal()">＋ محادثة خاصة جديدة</button>`+(l===null?'<p class="muted">جاري التحميل…</p>':l.length?l.map(x=>`<div class="card"><b>${esc(dmName(x))}</b><div class="chips"><button class="chip on" data-id="${esc(x.id)}" data-nm="${esc(dmName(x))}" onclick="openDm(this.dataset.id,this.dataset.nm)">💬 افتح</button></div></div>`).join(''):'<div class="card empty"><div style="font-size:34px">👤</div><b>لا توجد محادثات خاصة</b><p class="muted">ابحث عن شخص بالاسم وابدأ محادثة.</p></div>')}
  const g=cl.groups;if(g===null)return tabs+'<p class="muted">جاري التحميل…</p>';const m=g.filter(x=>cl.mine[x.id]);return tabs+whoBar()+(cl.err?`<div class="card alertbox" style="overflow-wrap:anywhere">${esc(cl.err)}</div>`:'')+(m.length?m.map(x=>grpCard(x,true)).join(''):'<div class="card empty"><div style="font-size:34px">💬</div><b>لا توجد جروبات</b><p class="muted">أنشئ جروبًا أو انضم لجروب من صفحة الجروبات ليظهر شاته هنا.</p><button class="chip on" onclick="openPage(\'groups\')">الجروبات</button></div>')},
  after:()=>{if(!cs())return;if(cl.ctab==='dm'){if(cl.dm===null)loadDms()}else if(cl.groups===null||Date.now()-(cl.gTs||0)>20000)loadGroups()}};
function openDm(id,name){cl.dmMsgs=null;cl.dmLast=0;openPage('dm',{id,name})}
function dmHtml(){const s=cs();return (cl.dmMsgs||[]).map(m=>`<div class="bub${s&&m.user_id===s.uid?' me':''}"><small>${when(m.created_at)}${s&&m.user_id!==s.uid?` · <a href="#" onclick="reportItem('message','dm:${m.id}');return false">إبلاغ</a>`:''}</small><div>${esc(m.body)}</div></div>`).join('')||'<p class="muted">ابدأ المحادثة…</p>'}
async function loadDmMsgs(id,quiet){try{const r=await sb('/rest/v1/dm_messages?chat_id=eq.'+encodeURIComponent(id)+'&select=id,body,created_at,user_id&order=id.desc&limit=60');const l=(r||[]).reverse(),last=l.length?l[l.length-1].id:0;if(quiet&&last===cl.dmLast&&cl.dmMsgs)return;cl.dmMsgs=l;cl.dmLast=last;const b=el('dmsgs');if(b){b.innerHTML=dmHtml();b.scrollTop=b.scrollHeight}else if(curPage()==='dm')renderPage()}catch(e){if(!quiet){cl.dmMsgs=cl.dmMsgs||[];msg(sbErr(e).slice(0,90))}}}
function curDm(){const t=pageStack[pageStack.length-1];return t&&t.n==='dm'?t.p:null}
async function sendDm(){if(banStop())return;const g=curDm(),b=val('dBody');if(!g||!b)return;try{await sb('/rest/v1/dm_messages',{method:'POST',body:{chat_id:g.id,body:b}});el('dBody').value='';await loadDmMsgs(g.id)}catch(e){msg(sbErr(e).slice(0,90))}}
PAGES.dm={title:p=>esc(p&&p.name||'محادثة'),render:p=>{if(!cs())return authCard();return `<div id="dmsgs" class="msgs">${cl.dmMsgs===null?'<p class="muted">جاري التحميل…</p>':dmHtml()}</div><div class="row" style="display:flex;gap:6px;margin-top:8px"><input id="dBody" class="input" maxlength="1000" placeholder="اكتب رسالة" aria-label="رسالة" onkeydown="if(event.key==='Enter')sendDm()"><button class="pact" onclick="sendDm()">إرسال</button></div>`},after:p=>{if(!cs()||!p)return;if(cl.dmMsgs===null)loadDmMsgs(p.id);else{const b=el('dmsgs');if(b)b.scrollTop=b.scrollHeight}}};
setInterval(()=>{const g=curDm();if(g&&!document.hidden&&cs()&&navigator.onLine)loadDmMsgs(g.id,true)},2000);

/* ===== الإشراف: حذف + إبلاغ + حظر + لوحة الإدارة ===== */
cl.admin=null;cl.ban=null;cl.rep=0;cl.meTs=0;cl.atab='reports';cl.rlist=null;cl.blist=null;cl.names={};
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i,NUM_RE=/^\d{1,18}$/;
function banActive(){return !!(cl.ban&&(!cl.ban.until||new Date(cl.ban.until).getTime()>Date.now()))}
function banMsg(){const b=cl.ban;return 'أنت محظور من المشاركة '+(b&&b.until?'حتى '+when(b.until):'بشكل دائم')+(b&&b.reason?' — '+b.reason:'')}
function banStop(){if(banActive()){msg(banMsg());return true}cl.ban=null;return false}
async function loadMe(){const s=cs();if(!s)return;
  try{const [a,b]=await Promise.all([sb('/rest/v1/admins?select=user_id&user_id=eq.'+s.uid),sb('/rest/v1/bans?select=id,until,reason&user_id=eq.'+s.uid+'&order=id.desc&limit=10')]);
    cl.admin=!!(a&&a.length);const now=Date.now();cl.ban=(b||[]).find(x=>!x.until||new Date(x.until).getTime()>now)||null}catch(e){}
  if(cl.admin)pollReports();if(curPage()==='groups'||curPage()==='chat')renderPage()}
function curGroupObj(){const g=curGroup();return g?((cl.groups||[]).find(x=>x.id===g.id)||null):null}
function canMod(g){const s=cs();return !!(cl.admin||(g&&s&&g.owner===s.uid))}
function whoBar(){const s=cs();if(!s)return '';return `<p class="muted">مسجّل باسم <b>${esc(s.name)}</b> · <a href="#" onclick="sbLogout();return false">خروج</a></p>`+(banActive()?`<div class="card alertbox"><b>⛔ ${esc(banMsg())}</b></div>`:'')+(cl.admin?`<button class="primary" style="margin-bottom:8px" onclick="openPage('admin')">🛡️ لوحة الإدارة${cl.rep?' ('+an(cl.rep)+' بلاغ جديد)':''}</button>`:'')}
async function delRow(path){const r=await sb(path,{method:'DELETE',prefer:'return=representation'});return !!(r&&r.length)}
function msgHtml(){const s=cs(),mod=canMod(curGroupObj());return (cl.msgs||[]).map(m=>{const me=s&&m.user_id===s.uid;return `<div class="bub${me?' me':''}"><small>${esc(m.profiles&&m.profiles.name||'')} · ${when(m.created_at)}${!me?` · <a href="#" onclick="reportItem('message','${m.id}');return false">إبلاغ</a>`:''}${me||mod?` · <a href="#" onclick="delMsg('${m.id}');return false">🗑 حذف</a>`:''}</small><div>${esc(m.body)}</div></div>`}).join('')||'<p class="muted">ابدأ المحادثة…</p>'}
function dmHtml(){const s=cs();return (cl.dmMsgs||[]).map(m=>{const me=s&&m.user_id===s.uid;return `<div class="bub${me?' me':''}"><small>${when(m.created_at)}${!me?` · <a href="#" onclick="reportItem('dm','${m.id}');return false">إبلاغ</a>`:` · <a href="#" onclick="delDmMsg('${m.id}');return false">🗑 حذف</a>`}</small><div>${esc(m.body)}</div></div>`}).join('')||'<p class="muted">ابدأ المحادثة…</p>'}
async function delMsg(id){if(!NUM_RE.test(String(id))||!confirm('حذف الرسالة؟'))return;const g=curGroup();try{const ok=await delRow('/rest/v1/messages?id=eq.'+id);if(!ok)msg('لم يتم الحذف (لا تملك الصلاحية)');if(g)await loadMsgs(g.id)}catch(e){msg(sbErr(e).slice(0,90))}}
async function delDmMsg(id){if(!NUM_RE.test(String(id))||!confirm('حذف الرسالة؟'))return;const g=curDm();try{const ok=await delRow('/rest/v1/dm_messages?id=eq.'+id);if(!ok)msg('لم يتم الحذف');if(g)await loadDmMsgs(g.id)}catch(e){msg(sbErr(e).slice(0,90))}}
async function delPost(id){if(!UUID_RE.test(String(id))||!confirm('حذف المنشور؟'))return;try{const ok=await delRow('/rest/v1/posts?id=eq.'+id);if(!ok)msg('لم يتم الحذف (لا تملك الصلاحية)');const g=curGroup();if(g)loadPosts(g.id)}catch(e){msg(sbErr(e).slice(0,90))}}
function groupBar(g){const s=cs();if(!g||!s)return '';const own=g.owner===s.uid,a=[];
  if(own||cl.admin)a.push(`<button class="chip" onclick="delGroup()">🗑 حذف الجروب</button>`);
  if(!own&&cl.mine[g.id])a.push(`<button class="chip" onclick="leaveGroup()">🚪 خروج من الجروب</button>`);
  if(!own)a.push(`<button class="chip" onclick="reportItem('group','${esc(g.id)}')">إبلاغ عن الجروب</button>`);
  return a.length?`<div class="chips">${a.join('')}</div>`:''}
async function delGroup(){const g=curGroup();if(!g||!UUID_RE.test(g.id)||!confirm('حذف الجروب بكل منشوراته ورسائله نهائيًا؟'))return;try{const ok=await delRow('/rest/v1/groups?id=eq.'+g.id);if(!ok){msg('لم يتم الحذف (لا تملك الصلاحية)');return}cl.groups=null;backBtn();msg('تم حذف الجروب')}catch(e){msg(sbErr(e).slice(0,90))}}
async function leaveGroup(){const g=curGroup(),s=cs();if(!g||!s||!confirm('الخروج من الجروب؟'))return;try{await delRow('/rest/v1/group_members?group_id=eq.'+g.id+'&user_id=eq.'+s.uid);cl.groups=null;backBtn();msg('تم الخروج من الجروب')}catch(e){msg(sbErr(e).slice(0,90))}}
async function delDm(){const g=curDm();if(!g||!UUID_RE.test(g.id)||!confirm('حذف المحادثة بالكامل لك وللطرف الآخر؟'))return;try{const ok=await delRow('/rest/v1/dm_chats?id=eq.'+g.id);if(!ok){msg('لم يتم الحذف');return}cl.dm=null;backBtn();msg('تم حذف المحادثة')}catch(e){msg(sbErr(e).slice(0,90))}}
{const _dm=PAGES.dm.render;PAGES.dm.render=p=>cs()?`<div class="chips"><button class="chip" onclick="delDm()">🗑 حذف المحادثة</button></div>`+_dm(p):_dm(p)}
/* --- الإبلاغ --- */
const REASONS=['إساءة أو سب','تحرش أو إزعاج','رسائل مزعجة (سبام)','محتوى غير لائق','أخرى'];
function findItem(kind,id){const sid=String(id),g=curGroup(),dm=curDm();
  if(kind==='post'){const x=(cl.posts||[]).find(p=>String(p.id)===sid);return x&&{author:x.user_id,snap:x.body,ref:g&&g.id}}
  if(kind==='message'){const x=(cl.msgs||[]).find(p=>String(p.id)===sid);return x&&{author:x.user_id,snap:x.body,ref:g&&g.id}}
  if(kind==='dm'){const x=(cl.dmMsgs||[]).find(p=>String(p.id)===sid);return x&&{author:x.user_id,snap:x.body,ref:dm&&dm.id}}
  if(kind==='group'){const x=(cl.groups||[]).find(p=>p.id===sid);return x&&{author:x.owner,snap:x.name+(x.description?' — '+x.description:''),ref:x.id}}
  return null}
function reportItem(kind,id){const o=findItem(kind,id);if(!o){msg('تعذر العثور على المحتوى');return}
  formModal('إبلاغ للإدارة',selF('rReason','سبب البلاغ',REASONS,REASONS[0])+inp('rNote','تفاصيل (اختياري)','',{area:1,max:300,rows:2})+'<p id="rErr" class="muted" style="color:#b0352d;overflow-wrap:anywhere"></p>',()=>{sendReport(kind,id,o);return false},{save:'إرسال البلاغ'})}
async function sendReport(kind,id,o){try{await ensureProfile();await sb('/rest/v1/reports',{method:'POST',body:{kind,target:String(id),reason:(val('rReason')+(val('rNote')?' — '+val('rNote'):'')).slice(0,400),author:UUID_RE.test(String(o.author))?o.author:null,snapshot:String(o.snap||'').slice(0,500),ref_id:o.ref?String(o.ref):null}});closeModal();msg('تم إرسال البلاغ للإدارة')}catch(e){showErr('rErr',e)}}
/* --- لوحة الإدارة --- */
const KIND_AR={post:'منشور',message:'رسالة جروب',dm:'رسالة خاصة',group:'جروب'};
async function pollReports(){if(!cl.admin||!cs())return;try{const r=await sb('/rest/v1/reports?select=id&status=eq.open&limit=100');const n=(r||[]).length;if(n>cl.rep&&cl.repInit)msg('🛡️ بلاغ جديد ('+an(n)+')');cl.repInit=true;if(n!==cl.rep){cl.rep=n;if(curPage()==='groups'||curPage()==='chat')renderPage()}}catch(e){}}
setInterval(()=>{if(cl.admin&&cs()&&!document.hidden&&navigator.onLine)pollReports()},60000);
async function loadNames(ids){ids=[...new Set(ids.filter(x=>x&&UUID_RE.test(String(x))))].filter(x=>!cl.names[x]);if(!ids.length)return;const r=await sb('/rest/v1/profiles?select=id,name&id=in.('+ids.join(',')+')');(r||[]).forEach(p=>cl.names[p.id]=p.name)}
function nmOf(id){return cl.names[id]||'مستخدم'}
async function loadAdmin(){cl.aTs=Date.now();try{
  if(cl.atab==='reports'){const r=await sb('/rest/v1/reports?select=*&status=eq.open&order=id.desc&limit=50');await loadNames((r||[]).flatMap(x=>[x.author,x.reporter]));cl.rlist=r||[];cl.rep=cl.rlist.length}
  else if(cl.atab==='bans'){const r=await sb('/rest/v1/bans?select=*&order=id.desc&limit=50');await loadNames((r||[]).map(x=>x.user_id));cl.blist=r||[]}
  else if(cl.groups===null)await loadGroups()}
  catch(e){msg(sbErr(e).slice(0,90));if(cl.atab==='reports')cl.rlist=[];else if(cl.atab==='bans')cl.blist=[]}
  if(curPage()==='admin')renderPage()}
function setAtab(t){cl.atab=t;if(t==='reports')cl.rlist=null;if(t==='bans')cl.blist=null;renderPage()}
function adminBody(){const L=cl.atab;
  if(L==='reports'){const l=cl.rlist;return l===null?'<p class="muted">جاري التحميل…</p>':l.length?l.map(x=>`<div class="card"><b>${esc(KIND_AR[x.kind]||x.kind)}</b> <span class="pill">${esc(x.reason)}</span><p class="muted">من: ${esc(nmOf(x.reporter))} · ضد: <b>${esc(nmOf(x.author))}</b> · ${when(x.created_at)}</p><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.snapshot)}</p><div class="chips"><button class="chip" onclick="repDelete(${Number(x.id)})">🗑 حذف المحتوى</button>${x.author?`<button class="chip" data-u="${esc(x.author)}" onclick="banModal(this.dataset.u,${Number(x.id)})">⛔ حظر الكاتب</button>`:''}<button class="chip" onclick="repClose(${Number(x.id)})">تجاهل</button></div></div>`).join(''):'<div class="card empty"><b>لا توجد بلاغات جديدة ✅</b></div>'}
  if(L==='bans'){const l=cl.blist;return l===null?'<p class="muted">جاري التحميل…</p>':l.length?l.map(x=>{const act=!x.until||new Date(x.until).getTime()>Date.now();return `<div class="card"><b>${esc(nmOf(x.user_id))}</b> <span class="pill">${act?(x.until?'حتى '+when(x.until):'دائم'):'منتهي'}</span><p class="muted">${esc(x.reason)}</p><div class="chips"><button class="chip" onclick="unban(${Number(x.id)})">رفع الحظر</button></div></div>`}).join(''):'<div class="card empty"><b>لا يوجد محظورون</b></div>'}
  const g=cl.groups;return g===null?'<p class="muted">جاري التحميل…</p>':g.length?g.map(x=>`<div class="card"><b>${esc(x.name)}</b> <span class="pill">${an(grpCount(x))} عضو</span><div class="chips"><button class="chip on" data-id="${esc(x.id)}" onclick="adminOpen(this.dataset.id)">فتح</button><button class="chip" data-id="${esc(x.id)}" onclick="adminDelGroup(this.dataset.id)">🗑 حذف</button></div></div>`).join(''):'<div class="card empty"><b>لا توجد جروبات</b></div>'}
PAGES.admin={title:()=>'🛡️ لوحة الإدارة',render:()=>{if(!cs()||!cl.admin)return '<div class="card empty"><b>غير مصرّح</b><p class="muted">هذه الصفحة للإدارة فقط.</p></div>';const T=[['reports','البلاغات'+(cl.rep?' ('+an(cl.rep)+')':'')],['bans','المحظورون'],['groups','الجروبات']];return `<div class="seg">${T.map(t=>`<button class="${cl.atab===t[0]?'on':''}" onclick="setAtab('${t[0]}')">${t[1]}</button>`).join('')}</div>`+adminBody()},
  act:()=>cl.admin?`<button class="pact" aria-label="تحديث" onclick="cl.aTs=0;cl.rlist=null;cl.blist=null;cl.gTs=0;renderPage()">↻</button>`:'',
  after:()=>{if(!cs()||!cl.admin)return;if((cl.atab==='reports'&&cl.rlist===null)||(cl.atab==='bans'&&cl.blist===null)||(cl.atab==='groups'&&cl.groups===null)||Date.now()-(cl.aTs||0)>15000)loadAdmin()}};
async function repClose(id){try{await sb('/rest/v1/reports?id=eq.'+Number(id),{method:'PATCH',prefer:'return=representation',body:{status:'done'}});cl.rlist=null;renderPage()}catch(e){msg(sbErr(e).slice(0,90))}}
async function repDelete(id){const r=(cl.rlist||[]).find(x=>Number(x.id)===Number(id));if(!r||!confirm('حذف هذا المحتوى نهائيًا؟'))return;
  const T={post:['posts',UUID_RE],message:['messages',NUM_RE],dm:['dm_messages',NUM_RE],group:['groups',UUID_RE]}[r.kind];
  if(!T||!T[1].test(String(r.target))){msg('هدف البلاغ غير صالح');return}
  try{const ok=await delRow('/rest/v1/'+T[0]+'?id=eq.'+r.target);msg(ok?'تم حذف المحتوى':'المحتوى محذوف مسبقًا');await repClose(id)}catch(e){msg(sbErr(e).slice(0,90))}}
function banModal(uid,repId){if(!UUID_RE.test(String(uid)))return;
  formModal('حظر مستخدم',selF('bDur','مدة الحظر',[['1','يوم'],['3','3 أيام'],['7','أسبوع'],['30','شهر'],['0','دائم']],'1')+inp('bReason','السبب','',{max:100})+'<p class="muted">يُمنع من النشر والرسائل وإنشاء الجروبات والانضمام خلال المدة.</p><p id="bErr" class="muted" style="color:#b0352d"></p>',()=>{doBan(uid,repId);return false},{save:'تأكيد الحظر'})}
async function doBan(uid,repId){const n=Number(val('bDur')),until=n?new Date(Date.now()+n*864e5).toISOString():null;
  try{await sb('/rest/v1/bans',{method:'POST',body:{user_id:uid,until,reason:val('bReason')}});if(repId)await repClose(repId);closeModal();msg('تم الحظر')}catch(e){showErr('bErr',e)}}
async function unban(id){if(!confirm('رفع الحظر؟'))return;try{await delRow('/rest/v1/bans?id=eq.'+Number(id));cl.blist=null;renderPage();msg('تم رفع الحظر')}catch(e){msg(sbErr(e).slice(0,90))}}
function adminOpen(id){if(!UUID_RE.test(id))return;openGroup(id,'posts')}
async function adminDelGroup(id){if(!UUID_RE.test(id)||!confirm('حذف الجروب نهائيًا؟'))return;try{const ok=await delRow('/rest/v1/groups?id=eq.'+id);msg(ok?'تم حذف الجروب':'لم يتم الحذف');cl.groups=null;renderPage()}catch(e){msg(sbErr(e).slice(0,90))}}

/* ---------- PWA ---------- */
let deferredInstall=null;
function pwaInit(){
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
  window.addEventListener('appinstalled',()=>{deferredInstall=null});
}
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else msg('التثبيت: من قائمة المتصفح اختر "إضافة إلى الشاشة الرئيسية"')}

function home(){return dayHome()+homeBase()}
function services(){return servicesBase()}
function startup(){checkReminders();setInterval(checkReminders,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});if(typeof pwaInit==='function')pwaInit()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
save();init();
